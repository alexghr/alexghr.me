version: '3'

services:
  www:
    image: "${DOCKER_REPO}/www.alexghr.me:latest"
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-west-2
        awslogs-group: alexghr.me
        awslogs-stream-prefix: www

  apex:
    image: "${DOCKER_REPO}/alexghr.me:latest"
    volumes:
      - /data/ubuntu/certs:/etc/nginx/certs
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-west-2
        awslogs-group: alexghr.me
        awslogs-stream-prefix: apex

  postgres:
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-west-2
        awslogs-group: alexghr.me
        awslogs-stream-prefix: postgres

  matrix:
    volumes:
      - /data/matrix:/data
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-west-2
        awslogs-group: alexghr.me
        awslogs-stream-prefix: matrix
