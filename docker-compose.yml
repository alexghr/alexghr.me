version: '3'

services:
  apex:
    image: alexghr.me:latest
    ports:
      - 80:80
      - 443:443
    links:
      - www
      - matrix
  www:
    image: www.alexghr.me:latest

  postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD

  matrix:
    image: matrixdotorg/synapse:latest
    links:
      - postgres
