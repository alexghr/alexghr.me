{{define "base" -}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <link rel="stylesheet" href="/static/reset.css" />
    <link rel="stylesheet" href="/static/main.css" />

    {{block "canonical" .}}<link rel="canonical" href="https://www.alexghr.me/" />{{end}}
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />

    {{block "title" .}}<title>Alex Gherghisan</title>{{end}}
    {{block "description" .}}<meta name="description" content="Alex Gherghisan, a software developer in London. Side projects in game development and developer tools." />{{end}}

    {{block "headEnd" .}}{{end}}
  </head>
  <body>
    <nav aria-label="Main">
      <a href="/"{{if eq .CurrentPage "home"}} aria-current="page"{{end}}>Home</a>
      <a href="/blog/"{{if eq .CurrentPage "blog"}} aria-current="page"{{else if eq .CurrentPage "post"}} aria-current="location"{{end}}>Blog</a>
    </nav>

    <main>{{block "main" .}}{{end}}</main>
    <footer>
      <a rel="noopener" href="https://github.com/alexghr">GitHub</a>
      <span aria-hidden="true" class="separator">|</span>
      <a rel="noopener" href="https://www.linkedin.com/in/alexghr/">LinkedIn</a>
      <span aria-hidden="true" class="separator">|</span>
      <a rel="noopener" href="mailto:hello@alexghr.me">Email</a>
    </footer>

    {{if .Debug}}
    <script type="module">
      globalThis.INSTANCE_ID = {{ .InstanceID }};
    </script>
    <script src="/static/reload.js" type="module"></script>
    {{end}}
  </body>
</html>
{{- end}}
