name: CI
on:
  pull_request:
  push:
    branches:
      - main
      - ag/rebuild

jobs:
  build:
    runs-on: nix
    env:
      DEVENV_PROFILE: ci
      GOCACHE: ${{ forgejo.workspace }}/.cache/go-build
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Go build artifacts
        uses: https://data.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'go.mod') }}-${{ forgejo.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'go.mod') }}-

      # The Nix runner provides Nix and a persistent store. ./shell uses the
      # repository's locked devenv version, just as the GitHub workflow does.
      - name: Materialize devenv shell
        run: ./shell true
      - name: Build and Test
        run: ./shell p-ci
