user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
  worker_connections  1024;
}


http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" "$proxy_protocol_addr"';
  access_log  /var/log/nginx/access.log  main;

  server_tokens off;
  add_header X-Frame-Options sameorigin;
  add_header X-Content-Type-Options nosniff;
  add_header X-XSS-Protection "1; mode=block";
  add_header Referrer-Policy no-referrer-when-downgrade;

  # Cloudflare IPs from https://www.cloudflare.com/ips/
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;

  # Clouflare header https://developers.cloudflare.com/fundamentals/get-started/reference/http-request-headers/#cf-connecting-ip
  real_ip_header CF-Connecting-IP;

  keepalive_timeout  65;
  gzip  on;

  server {

    listen 80 default_server;
    server_name "";

    root /srv;

    charset utf-8;

    add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate, proxy-revalidate";
    expires off;
    etag on;

    location /_astro {
      add_header Cache-Control "public, immutable";
      expires 1y;
    }

    location ~ \.html$ {
      add_header Cache-Control "public, max-age=60, s-maxage=600, must-revalidate, proxy-revalidate";
      expires off;
    }

    location ~ \.xml$ {
      add_header Cache-Control "public, max-age=60, s-maxage=600, must-revalidate, proxy-revalidate";
      expires off;
    }

    location = /rss.xml {
      types {
        application/rss+xml xml;
      }
      add_header Cache-Control "public, max-age=60, s-maxage=600, must-revalidate, proxy-revalidate";
      expires off;
    }

    location /feed {
      rewrite ^/feed(\.*)$ /rss.xml$1 last;
    }

  }
}
