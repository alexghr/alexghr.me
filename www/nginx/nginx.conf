user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
  worker_connections  1024;
}


http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" "$proxy_protocol_addr"';
  access_log  /var/log/nginx/access.log  main;

  server_tokens off;
  add_header X-Frame-Options sameorigin;
  add_header X-Content-Type-Options nosniff;
  add_header X-XSS-Protection "1; mode=block";
  add_header Referrer-Policy no-referrer-when-downgrade;

  keepalive_timeout  65;
  gzip  on;

  server {

    listen 80 default_server;
    server_name "";

    root /srv;

    charset utf-8;

    add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate, proxy-revalidate";
    expires off;
    etag on;

    location /_astro {
      add_header Cache-Control "public, immutable";
      expires 1y;
    }

    location ~ \.html$ {
      add_header Cache-Control "public, max-age=60, s-maxage=600, must-revalidate, proxy-revalidate";
      expires off;
    }

    location ~ \.xml$ {
      add_header Cache-Control "public, max-age=60, s-maxage=600, must-revalidate, proxy-revalidate";
      expires off;
    }

    location = /rss.xml {
      types {
        application/rss+xml xml;
      }
      add_header Cache-Control "public, max-age=60, s-maxage=600, must-revalidate, proxy-revalidate";
      expires off;
    }

    location /feed {
      rewrite ^/feed(\.*)$ /rss.xml$1 last;
    }

  }
}
