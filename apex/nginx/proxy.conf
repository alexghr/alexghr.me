proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_pass_request_headers on;
proxy_pass_request_body on;
proxy_buffering off;
proxy_redirect off;

server {
  server_name www.alexghr.me;

  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  location / {
    proxy_pass http://www;
  }
}

server {
  server_name news.alexghr.me;

  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  location / {
    proxy_pass http://news:8080;
  }
}

server {
  server_name mkd.alexghr.me;

  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  location / {
    proxy_pass http://mkd-fe;
  }
}

server {
  server_name signal.alexghr.me;

  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  location / {
    proxy_pass http://mkd-s:8081;
  }
}
